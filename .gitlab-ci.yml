stages:
  - test

default:
  # All jobs are interruptable by default
  interruptible: true

variables:
  # The backend is not built here. Its own pipeline publishes an image, which the jobs run as a service.
  # Override BACKEND_IMAGE (e.g. when running a pipeline manually) to test against the image of another
  # backend branch: <registry>/<namespace>/controlpage-backend:<branch>
  BACKEND_IMAGE: "$CI_REGISTRY/$CI_PROJECT_NAMESPACE/controlpage-backend:latest"

include:
  - local: .gitlab/ci/*.gitlab-ci.yml
