<!--suppress HtmlFormInputWithoutLabel -->
<!--<div>view-edit works!</div>-->
<div id="viewEditContent">
  <div class="row-wrapper">
    <div id="editViewDisplay">
      @if (view) {
        <app-view-renderer
          [view]="view"
          [isEditMode]="true"
          (fieldPress)="onEditFieldPress($event)"
          [fieldRenderParameter]="fieldParams"
        />
      }
    </div>

    <span class="flex-fill-space"></span>

    @if (view) {
      <div
        id="editSection"
      >
        <app-view-edit-section
          [view]="view"
        />

        @if (selectedField) {
          <app-field-edit-section
            [selectedField]="selectedField"
          />
        }
      </div>
    }
  </div>

  <div style="height: 50px"></div>

  <div>
    <div>Preview</div>
    <div id="previewViewDisplay">
      @if (view) {
        <app-view-renderer
          [view]="view"
          [isEditMode]="false"
          (fieldPress)="onActionFieldPress($event)"
        />
      }
    </div>
  </div>
</div>
