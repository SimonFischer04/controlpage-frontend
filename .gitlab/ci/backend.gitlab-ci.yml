.mariadb:
  services:
    - name: mariadb:10
      alias: mariadb

# Builds the backend, starts it and exports its OpenAPI spec.
# Artifacts: backend.jar (used by e2e:fullstack) and openapi.json (used to generate src/gen).
backend:
  stage: prepare
  image: maven:3.9-eclipse-temurin-17
  extends: .mariadb
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  cache:
    key: backend-maven
    paths:
      - .m2/repository
  script:
    - git clone --depth 1 --branch "$BACKEND_REF" "$BACKEND_REPO_URL" backend-src
    - echo "Testing against backend $(git -C backend-src rev-parse HEAD) ($BACKEND_REF)"
    - (cd backend-src && mvn -B -q package -Dmaven.test.skip=true)
    - cp backend-src/target/controlpage-backend-*.jar backend.jar
    - .gitlab/ci/scripts/start-backend.sh
    - curl -sSf http://localhost:42000/v3/api-docs -o openapi.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - backend.jar
      - backend.log
      - openapi.json
