# Docker image of the frontend (see Dockerfile), built on every branch so a broken image build fails before the merge.
# Only the default branch publishes it, as <registry>/<this project>:latest, which the deployment examples in
# controlpage-releases use. Branch images are not pushed, they would stay in the registry for good.
#
# Runs after the test stage, so an image is only published if the e2e tests pass.
# The runner mounts the host's Docker socket into the job, so the image is built by the host's Docker daemon
# (no Docker-in-Docker service). Its layer cache and the npm cache of the Dockerfile persist between builds.
# (the job is not called "image": at the top level that is the keyword for the global default image)
docker-image:
  stage: build
  image: docker:27
  variables:
    # a tag of its own: the Docker daemon is shared with other jobs, which could otherwise retag it before the push
    IMAGE: "controlpage-frontend:ci-job-$CI_JOB_ID"
  script:
    - docker build --pull -t "$IMAGE" .
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker tag "$IMAGE" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      else
        echo "Not the default branch: the image is only built, not published."
      fi
  after_script:
    - docker image rm "$IMAGE" || true
