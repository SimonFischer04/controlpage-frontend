# End-to-end tests: the frontend against the real backend and a real PostgreSQL (see .backend).
e2e:
  stage: test
  image: cypress/base:18.20.3
  extends: .backend
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
    CYPRESS_CACHE_FOLDER: "$CI_PROJECT_DIR/.cache/Cypress"
    CYPRESS_backendUrl: "http://backend:42000"
    NG_CLI_ANALYTICS: "false"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm
      - .cache/Cypress
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    - node .gitlab/ci/scripts/wait-for-backend.js
    - npm run e2e
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - cypress/screenshots
      - cypress/results
    reports:
      junit: cypress/results/*.xml
